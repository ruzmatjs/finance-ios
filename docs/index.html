  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='hisobot.csv';a.click();}

// ---- Toʻliq zaxira (JSON): butun state, tiklash bilan ----
function backupJSON(){ return JSON.stringify(state); }
function backupName(){ const d=new Date(),p=n=>String(n).padStart(2,'0');
  return 'finance-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.json'; }
function openBackup(){
  haptic('medium');
  const j=backupJSON(), kb=(new TextEncoder().encode(j).length/1024).toFixed(1);
  openSheet(`${sheetHead('Toʻliq zaxira')}
    <div class="hint" style="margin:6px 0 10px">${state.tx.length} tranzaksiya · ${kb} KB. Matnni nusxalab Telegramdagi «Saqlangan xabarlar»ga yuboring — shunda hech qachon yoʻqolmaydi.</div>
    <textarea id="bkTa" readonly style="height:150px;font-size:11px;font-family:monospace">${esc(j)}</textarea>
    <button class="btn" style="margin-top:10px" onclick="copyBackup()">📋 Nusxalash</button>
    <button class="btn ghost" style="margin-top:10px" onclick="downloadBackup()">⬇️ Fayl sifatida saqlash</button>
    <button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">Yopish</button>`);
}
function copyBackup(){
  const ta=document.getElementById('bkTa'); if(!ta)return;
  ta.removeAttribute('readonly'); ta.focus(); ta.setSelectionRange(0,ta.value.length);
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  ta.setAttribute('readonly','');
  const done=()=>{notify('success');toast('Zaxira nusxalandi ✅');};
  const fail=()=>alert('Nusxalanmadi. Matnni qoʻlda belgilab nusxalang.');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(done,()=>{ ok?done():fail(); });
  } else { ok?done():fail(); }
}
function downloadBackup(){
  try{
    const url=URL.createObjectURL(new Blob([backupJSON()],{type:'application/json'}));
    const a=document.createElement('a'); a.href=url; a.download=backupName(); a.click();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){ alert('Fayl saqlanmadi. Matnni nusxalab oling.'); }
}
function openRestore(){
  haptic('medium');
  openSheet(`${sheetHead('Zaxiradan tiklash')}
    <div class="hint" style="margin:6px 0 10px">⚠️ Hozirgi barcha maʼlumot zaxiradagisi bilan almashtiriladi.</div>
    <input type="file" id="bkFile" accept="application/json,.json" onchange="restoreFromFile(this)" style="font-size:13px">
    <textarea id="rsTa" placeholder="Yoki zaxira matnini shu yerga qoʻying" style="height:120px;font-size:11px;font-family:monospace"></textarea>
    <button class="btn danger" style="margin-top:10px" onclick="restoreFromText()">📥 Tiklash</button>
    <button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">Bekor qilish</button>`);
}
function restoreFromFile(inp){
  const f=inp&&inp.files&&inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>applyRestore(String(r.result||''));
  r.onerror=()=>alert('Fayl oʻqilmadi');
  r.readAsText(f);
}
function restoreFromText(){ const ta=document.getElementById('rsTa'); applyRestore(ta?ta.value:''); }
function applyRestore(raw){
  let obj=null;
  try{ obj=JSON.parse(String(raw||'').trim()); }
  catch(e){ alert('Notoʻgʻri JSON: '+e.message); return; }
  if(!obj||typeof obj!=='object'||!Array.isArray(obj.tx)){ alert('Bu Finance zaxirasi emas — tx roʻyxati topilmadi.'); return; }
  if(!confirm(obj.tx.length+' ta tranzaksiya tiklanadi. Hozirgi maʼlumot almashtiriladi. Davom etilsinmi?')) return;
  state=obj; ensure(); applyTheme(); localWrite(); save(); render(); closeSheet();
  notify('success'); toast('Tiklandi ✅ · '+state.tx.length+' ta yozuv');
}
function esc(s){return(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

// ---- Ishga tushirish: lokal, IndexedDB, bulut va worker bilan sinxronizatsiya ----
async function boot(){
  render(); // 1. Lokal maʼlumot bilan darhol koʼrsatamiz (0ms)
  setTimeout(syncReports, 2500);

  // 2. IndexedDB'dan yuklash (iOS WebKit'da localStorage tozalansa ham saqlanadi)
  try {
    const idbState = await idbGet();
    if(idbState && typeof idbState === 'object' && (idbState.tx?.length || idbState.updatedAt)){
      state = mergeStates(state, idbState);
      ensure();
      applyTheme();
      localWrite();
      render();
    }
  } catch(e){
    console.warn('IDB load error:', e);
  }

  // 3. Telegram CloudStorage'dan yuklash va birlashtirish
  if(cloudOn()){
    try {
      const cloud = await cloudLoad();
      if(cloud && typeof cloud === 'object'){
        state = mergeStates(state, cloud);
        ensure();
        applyTheme();
        localWrite();
        idbSet(state);
        runRecurring();
        render();
      }
    } catch(e){
      console.warn('Cloud load error:', e);
    }
  }

  // 4. Worker zaxirasidan ham eng soʻnggi maʼlumotlarni birlashtiramiz (telefon <-> desktop)
  if(reportApi() && TG && TG.initData){
    try {
      const res = await reportPost('/pull');
      if(absorbPull(res)){
        ensure();
        applyTheme();
        localWrite();
        idbSet(state);
        render();
      }
      await ackPending(res);
    } catch(e){}
  }

  _ready = true;
  runRecurring();

  // 5. Birlashgan holatni barcha xotiralarga saqlab qo'yamiz
  if(cloudOn()){
    cloudSave();
  }
  idbSet(state);
}

// ============ Qurilmalararo davriy va avtomatik sinxronizatsiya ============
let _syncing = false;
async function syncWithCloud(silent = true){
  if(_syncing) return;
  _syncing = true;
  let changed = false;
  let pulled = null;
  try {
    if(cloudOn()){
      const cloud = await cloudLoad();
      if(cloud && typeof cloud === 'object'){
        const prevTxLen = (state.tx||[]).length;
        const prevUp = state.updatedAt || 0;
        state = mergeStates(state, cloud);
        if((state.tx||[]).length !== prevTxLen || (state.updatedAt||0) > prevUp){
          changed = true;
        }
      }
    }
    if(reportApi() && TG && TG.initData){
      pulled = await reportPost('/pull');
      const prevTxLen = (state.tx||[]).length;
      const prevUp = state.updatedAt || 0;
      if(absorbPull(pulled)){
        if((state.tx||[]).length !== prevTxLen || (state.updatedAt||0) > prevUp){
          changed = true;
        }
      }
    }
    if(changed){
      ensure();
      localWrite();
      idbSet(state);
      render();
      if(cloudOn()) cloudSave();
    }
    await ackPending(pulled);
  } catch(e){
    if(!silent) console.warn('sync error:', e);
  } finally {
    _syncing = false;
  }
}

window.addEventListener('focus', () => { syncWithCloud(true); checkAppUpdate(); });
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){ syncWithCloud(true); checkAppUpdate(); }
});

// Ilova ochilgach bir marta - eski kesh ochilgan boʻlsa yangilanish taklif qilinadi
setTimeout(checkAppUpdate, 4000);
setInterval(() => {
  if(document.visibilityState === 'visible') syncWithCloud(true);
}, 25000);

boot();
</script>
