<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Finance — Shaxsiy moliya</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --card2:#f7f7fa; --text:#1c1c1e; --text2:#8e8e93; --text3:#c7c7cc;
    --sep:#e5e5ea; --accent:#5e5ce6; --accent2:#0a84ff;
    --income:#34c759; --expense:#ff3b30; --transfer:#0a84ff; --warn:#ff9500;
    --radius:18px; --shadow:0 4px 16px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --text:#fff; --text2:#98989f; --text3:#48484a;
           --sep:#2c2c2e; --shadow:0 4px 16px rgba(0,0,0,.4); }
  }
  :root[data-theme="light"]{ --bg:#f2f2f7; --card:#fff; --card2:#f7f7fa; --text:#1c1c1e; --text2:#8e8e93; --text3:#c7c7cc; --sep:#e5e5ea; --shadow:0 4px 16px rgba(0,0,0,.06); }
  :root[data-theme="dark"]{ --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --text:#fff; --text2:#98989f; --text3:#48484a; --sep:#2c2c2e; --shadow:0 4px 16px rgba(0,0,0,.4); }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);
       overscroll-behavior:none;padding-bottom:100px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:600px;margin:0 auto;padding:16px}
  h1{font-size:26px;font-weight:800;margin:8px 0 16px}
  h2{font-size:17px;font-weight:700;margin:0}
  .muted{color:var(--text2)} .mono{font-variant-numeric:tabular-nums}
  .card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .row{display:flex;align-items:center;gap:12px}
  .between{display:flex;align-items:center;justify-content:space-between}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .link{color:var(--accent);font-size:14px;font-weight:600;cursor:pointer}
  .back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);cursor:pointer;font-size:16px;font-weight:600;margin-bottom:6px}
  .hero{background:linear-gradient(135deg,#5e5ce6,#0a84ff);color:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 26px rgba(94,92,230,.35);margin-bottom:14px}
  .hero.danger{background:linear-gradient(135deg,#ff3b30,#ff453a);box-shadow:0 10px 26px rgba(255,59,48,.35)}
  .hero .lbl{opacity:.85;font-size:14px;font-weight:600}
  .hero .amt{font-size:34px;font-weight:800;margin:6px 0;letter-spacing:-.5px}
  .hero .sub{font-size:13px;font-weight:600;opacity:.95}
  .stat .ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px}
  .stat .t{font-size:12px;color:var(--text2);margin:8px 0 2px} .stat .v{font-size:18px;font-weight:800}
  .cic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .tx{padding:10px 0;border-bottom:1px solid var(--sep)} .tx:last-child{border-bottom:none}
  .tx .name{font-weight:600} .tx .meta{font-size:12px;color:var(--text2)} .tx .amt{font-weight:700;font-variant-numeric:tabular-nums}
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--sep);display:flex;justify-content:space-around;padding:8px 0 26px;z-index:20}
  .tabbar button{background:none;border:none;color:var(--text2);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;cursor:pointer}
  .tabbar button .ti{font-size:20px} .tabbar button.active{color:var(--accent)}
  .fab{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;background:linear-gradient(180deg,#5e5ce6,#0a84ff);color:#fff;border:none;font-size:30px;box-shadow:0 8px 20px rgba(10,132,255,.45);z-index:25;cursor:pointer;line-height:1}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none;align-items:flex-end}
  .modal.show{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:600px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px;max-height:92vh;overflow-y:auto;animation:up .25s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
  .seg{display:flex;background:var(--sep);border-radius:12px;padding:3px;margin:12px 0}
  .seg button{flex:1;border:none;background:none;padding:9px;border-radius:9px;font-weight:600;color:var(--text2);cursor:pointer;font-size:14px}
  .seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  label.fld{display:block;font-size:13px;color:var(--text2);margin:14px 0 0}
  input,textarea,select{width:100%;border:none;background:var(--card);border-radius:12px;padding:13px;font-size:16px;color:var(--text);margin-top:8px;font-family:inherit}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent)}
  .amtinput{font-size:34px;font-weight:800;text-align:center}
  .cats{display:flex;gap:10px;overflow-x:auto;padding:10px 0;scrollbar-width:none} .cats::-webkit-scrollbar{display:none}
  .catbtn{flex-shrink:0;width:70px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;opacity:.5;transition:.15s}
  .catbtn.on{opacity:1;transform:scale(1.05)} .catbtn .lbl{font-size:11px;text-align:center;line-height:1.1}
  .btn{width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;background:linear-gradient(180deg,#5e5ce6,#0a84ff);color:#fff;margin-top:14px;cursor:pointer}
  .btn.ghost{background:var(--sep);color:var(--text)} .btn.danger{background:var(--expense)}
  .hint{font-size:12px;color:var(--text2);margin-top:6px}
  .ai{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:12px;padding:4px 4px 4px 12px;margin-top:8px}
  .ai input{margin:0;background:none;padding:9px 0} .ai button{border:none;background:var(--accent);color:#fff;border-radius:9px;padding:9px 12px;font-weight:600;cursor:pointer}
  .empty{text-align:center;padding:36px 20px;color:var(--text2)} .empty .e{font-size:44px;margin-bottom:10px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px}
  .bars .b{flex:1;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:6px 6px 0 0;min-height:3px}
  .bl{font-size:10px;color:var(--text2);text-align:center;margin-top:4px}
  .legend{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .legend .li{display:flex;align-items:center;gap:8px;font-size:14px} .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .pct{margin-left:auto;color:var(--text2);font-size:13px}
  .prog{height:8px;background:var(--sep);border-radius:99px;overflow:hidden;margin:8px 0}
  .prog>i{display:block;height:100%;border-radius:99px}
  .ring{transform:rotate(-90deg)}
  .listrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--sep);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(94,92,230,0.15)}
  .listrow *{pointer-events:none}
  .chip{display:inline-block;padding:5px 12px;border-radius:99px;background:var(--card);font-size:13px;font-weight:600;border:1px solid var(--sep);cursor:pointer;color:var(--text2);touch-action:manipulation}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
  .cal .d{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;cursor:pointer;gap:2px}
  .cal .d.on{background:rgba(94,92,230,.18)} .cal .d.dim{color:var(--text3)}
  .cal .dots{display:flex;gap:2px;height:5px} .cal .dots i{width:5px;height:5px;border-radius:50%}
  .heat{display:flex;gap:3px} .heat .col{display:flex;flex-direction:column;gap:3px} .heat .cell{width:13px;height:13px;border-radius:2px}
  .swipe{position:relative;overflow:hidden}
  .del{color:var(--expense);font-weight:600;cursor:pointer;font-size:13px}
  .hidden{display:none}
  select{appearance:none;background-image:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<button class="fab" onclick="openTx()">+</button>
<div class="tabbar">
  <button data-tab="home" class="active" onclick="go('home')"><span class="ti">🏠</span>Asosiy</button>
  <button data-tab="list" onclick="go('list')"><span class="ti">📃</span>Tranzaksiya</button>
  <button data-tab="wishlist" onclick="go('wishlist')"><span class="ti">🛍️</span>Rejalar</button>
  <button data-tab="report" onclick="go('report')"><span class="ti">📊</span>Hisobot</button>
  <button data-tab="settings" onclick="go('settings')"><span class="ti">⚙️</span>Sozlama</button>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
// ============ Telegram ============
const TG=window.Telegram?.WebApp;
if(TG){
  TG.ready();
  TG.expand();
  try{TG.setHeaderColor('bg_color')}catch(e){}
  try{
    TG.BackButton?.onClick(()=>{
      if(document.getElementById('modal')?.classList.contains('show')){
        closeSheet();
      } else if(typeof page!=='undefined'&&typeof tab!=='undefined'&&page!==tab){
        nav(tab||'home');
      }
    });
  }catch(e){}
}
function haptic(t='light'){try{TG?.HapticFeedback?.impactOccurred(t)}catch(e){}}
function notify(t='success'){try{TG?.HapticFeedback?.notificationOccurred(t)}catch(e){}}

// ============ Default kategoriyalar ============
const DEF_CATS=[
 {n:'Maosh',e:'💰',c:'#34c759',t:'income'},{n:'Bonus',e:'🎁',c:'#30d158',t:'income'},
 {n:'Frilans',e:'💻',c:'#00c7be',t:'income'},{n:'Investitsiya',e:'📈',c:'#32ade6',t:'income'},
 {n:'Sovgʼa',e:'🎀',c:'#af52de',t:'income'},{n:'Qarz',e:'🤝',c:'#34c759',t:'income'},{n:'Boshqa',e:'➕',c:'#8e8e93',t:'income'},
 {n:'Ovqat',e:'🍔',c:'#ff9500',t:'expense'},{n:'Ichimliklar',e:'🥤',c:'#00c7be',t:'expense'},
 {n:'Uydagilar',e:'👨‍👩‍👧‍👦',c:'#af52de',t:'expense'},
 {n:'Qarz',e:'🤝',c:'#ff9500',t:'expense'},{n:'Kredit',e:'💳',c:'#ff2d55',t:'expense'},
 {n:'Transport',e:'🚌',c:'#0a84ff',t:'expense'},{n:'Yoqilgʼi',e:'⛽',c:'#ff453a',t:'expense'},
 {n:'Xarid',e:'🛍️',c:'#ff2d55',t:'expense'},{n:'Koʼngilochar',e:'🎮',c:'#af52de',t:'expense'},
 {n:'Salomatlik',e:'❤️',c:'#ff3b30',t:'expense'},{n:'Dorixona',e:'💊',c:'#ff6482',t:'expense'},
 {n:'Jarimalar',e:'👮',c:'#ff453a',t:'expense'},{n:'Internet',e:'🌐',c:'#0a84ff',t:'expense'},
 {n:'Aloqa',e:'📶',c:'#30b0c7',t:'expense'},
 {n:'Boshqa',e:'📦',c:'#8e8e93',t:'expense'},
];
const PALETTE=['#ff3b30','#ff9500','#ffcc00','#34c759','#00c7be','#0a84ff','#5856d6','#af52de','#ff2d55','#a2845e','#8e8e93','#64d2ff'];
const EMOJIS=['💰','🎁','💻','📈','🍔','☕','🥤','💧','👨‍👩‍👧‍👦','🤝','💳','🏛️','🍽️','🚌','🚕','⛽','🛍️','👕','📱','🎮','❤️','💊','🏋️','✈️','💡','🌐','📶','🏠','🎯','📦','🐶','🎓','💵','👮','📜'];

// ============ Holat ============
let state=load()||{};
let _ready=false,_cloudTimer=null;
function load(){try{return JSON.parse(localStorage.getItem('finance.v1'))}catch(e){return null}}
function localWrite(){localStorage.setItem('finance.v1',JSON.stringify(state))}
function save(){state.updatedAt=Date.now();localWrite();scheduleCloud();}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function ensure(){
  state.tx=state.tx||[];
  state.currency=state.currency||'UZS';
  state.theme=state.theme||'system';
  state.cats=state.cats||DEF_CATS.map(c=>({...c}));
  const removedNames=['Kafe','Kofe','Sport','Ijara','Restoran','Taksi','Kiyim','Texnika','Sayohat','Kommunal'];
  state.cats=state.cats.filter(c=>!removedNames.includes(c.n));

  // Migrate category data across state
  state.tx.forEach(t=>{
    if(t.cat==='Restoran') t.cat='Ovqat';
    else if(t.cat==='Taksi') t.cat='Transport';
    else if(t.cat==='Kiyim'||t.cat==='Texnika') t.cat='Xarid';
    else if(t.cat==='Kommunal') t.cat='Uydagilar';
    else if(t.cat==='Sayohat') t.cat='Boshqa';
  });

  state.recurring=state.recurring||[];
  state.recurring.forEach(r=>{
    if(r.cat==='Restoran') r.cat='Ovqat';
    else if(r.cat==='Taksi') r.cat='Transport';
    else if(r.cat==='Kiyim'||r.cat==='Texnika') r.cat='Xarid';
    else if(r.cat==='Kommunal') r.cat='Uydagilar';
    else if(r.cat==='Sayohat') r.cat='Boshqa';
  });

  state.wishlist=state.wishlist||[];
  state.wishlist.forEach(w=>{
    if(w.cat==='Restoran') w.cat='Ovqat';
    else if(w.cat==='Taksi') w.cat='Transport';
    else if(w.cat==='Kiyim'||w.cat==='Texnika') w.cat='Xarid';
    else if(w.cat==='Kommunal') w.cat='Uydagilar';
    else if(w.cat==='Sayohat') w.cat='Xarid';
  });

  state.budgets=state.budgets||[];
  state.budgets.forEach(b=>{
    if(Array.isArray(b.catIds)){
      b.catIds=b.catIds.map(c=>{
        if(c==='Restoran') return 'Ovqat';
        if(c==='Taksi') return 'Transport';
        if(c==='Kiyim'||c==='Texnika') return 'Xarid';
        if(c==='Kommunal') return 'Uydagilar';
        if(c==='Sayohat') return 'Boshqa';
        return c;
      });
      b.catIds=[...new Set(b.catIds)].filter(c=>!removedNames.includes(c));
    }
  });

  if(!state.cats.some(c=>c.n==='Uydagilar'&&c.t==='expense')){
    state.cats.splice(9,0,{n:'Uydagilar',e:'👨‍👩‍👧‍👦',c:'#af52de',t:'expense'});
  }
  if(!state.cats.some(c=>c.n==='Jarimalar'&&c.t==='expense')){
    state.cats.push({n:'Jarimalar',e:'👮',c:'#ff453a',t:'expense'});
  }
  if(!state.cats.some(c=>c.n==='Ichimliklar'&&c.t==='expense')){
    state.cats.splice(8,0,{n:'Ichimliklar',e:'🥤',c:'#00c7be',t:'expense'});
  }
  if(!state.cats.some(c=>c.n==='Qarz'&&c.t==='expense')){state.cats.push({n:'Qarz',e:'🤝',c:'#ff9500',t:'expense'});}
  if(!state.cats.some(c=>c.n==='Kredit'&&c.t==='expense')){state.cats.push({n:'Kredit',e:'💳',c:'#ff2d55',t:'expense'});}
  if(!state.cats.some(c=>c.n==='Qarz'&&c.t==='income')){state.cats.push({n:'Qarz',e:'🤝',c:'#34c759',t:'income'});}
  if(!state.accounts){state.accounts=[
    {id:'cash',name:'Naqd',e:'💵',c:'#34c759',opening:0},
    {id:'card',name:'Bank karta',e:'💳',c:'#0a84ff',opening:0}];}
  state.goals=state.goals||[];
  state.debts=state.debts||[];
  state.wishlist=state.wishlist||[];
  if(typeof state.hideBalance!=='boolean') state.hideBalance=false;
  state.tx.forEach(t=>{ if(!t.accountId) t.accountId=state.accounts[0].id; });

  // Clean bogus repayment records that were mistakenly created as debts
  state.debts = state.debts.filter(d => {
    if(!d || typeof d !== 'object') return false;
    const note = (d.note || '').toLowerCase();
    if(note.startsWith('qarz qaytarildi') || note.startsWith('qarz toʻlandi') || note.startsWith('qarz to\'landi')) return false;
    return true;
  });

  // Ensure valid debt object structures
  state.debts.forEach(d => {
    d.amount = parseFloat(d.amount) || 0;
    d.paid = parseFloat(d.paid) || 0;
    d.person = (d.person || 'Shaxs (Qarz)').trim();
    d.type = (d.type === 'borrow') ? 'borrow' : 'lend';
    d.status = (d.paid >= d.amount && d.amount > 0) ? 'settled' : (d.status || 'active');
    d.accountId = d.accountId || state.accounts[0].id;
    d.dueDate = d.dueDate || '';
    d.note = d.note || '';
    d.date = d.date || new Date().toISOString();
  });

  // Ensure valid wishlist object structures
  state.wishlist.forEach(w => {
    w.id = w.id || genId();
    w.title = (w.title || 'Buyum').trim();
    w.price = parseFloat(w.price) || 0;
    w.image = w.image || '';
    w.cat = w.cat || 'Xarid';
    w.priority = w.priority || 'medium';
    w.status = w.status || 'planned';
    w.note = w.note || '';
    w.date = w.date || new Date().toISOString();
  });

  syncHistoricalDebts();
}

function extractPersonFromTx(t){
  let name = (t.merchant || '').trim();
  if(!name || name === 'Qarz' || name === 'Qarzlar' || name === 'Oʼtkazma'){
    name = (t.note || '').trim();
  }
  name = name.replace(/^Qarz\s*(berildi|olindi|qaytarildi|toʻlandi|to'landi)?\s*:\s*/i, '').trim();
  if(!name || name.toLowerCase() === 'qarz' || name.toLowerCase() === 'boshqa') name = 'Shaxs (Qarz)';
  return name;
}

function syncHistoricalDebts(){
  state.debts = state.debts || [];
  if(!state.tx || !state.tx.length) return;
  state.tx.forEach(t => {
    if(t.isRepay) return;
    const note = (t.note || '').toLowerCase();
    if(note.startsWith('qarz qaytarildi') || note.startsWith('qarz toʻlandi') || note.startsWith('qarz to\'landi')) return;

    const isQarzCat = t.cat === 'Qarz';
    const isQarzMerchant = t.merchant && t.merchant.toLowerCase().includes('qarz');
    const isQarzNote = t.note && t.note.toLowerCase().includes('qarz');
    if(isQarzCat || isQarzMerchant || isQarzNote){
      const exists = state.debts.some(d => (d.txId && d.txId === t.id) || (d.amount === t.amount && d.date === t.date));
      if(!exists){
        const isExp = t.type === 'expense';
        const personName = extractPersonFromTx(t);
        state.debts.push({
          id: genId(),
          txId: t.id,
          type: isExp ? 'lend' : 'borrow',
          person: personName,
          amount: t.amount || 0,
          paid: 0,
          accountId: t.accountId || state.accounts[0].id,
          dueDate: '',
          note: t.note || '',
          date: t.date || new Date().toISOString(),
          status: 'active'
        });
      }
    }
  });
}

// ---- Telegram CloudStorage sync (barcha Telegram qurilmalarida) ----
function cloudOn(){return !!(TG&&TG.CloudStorage&&TG.isVersionAtLeast&&TG.isVersionAtLeast('6.9'))}
function chunkBytes(str,max){const enc=new TextEncoder();const out=[];let cur='',b=0;
  for(const ch of str){const n=enc.encode(ch).length;if(b+n>max){out.push(cur);cur=ch;b=n;}else{cur+=ch;b+=n;}}
  if(cur)out.push(cur);return out;}
function cloudSave(){ if(!cloudOn())return; const ch=chunkBytes(JSON.stringify(state),3500);
  TG.CloudStorage.setItem('fin_n',String(ch.length),()=>{});
  ch.forEach((c,i)=>TG.CloudStorage.setItem('fin_'+i,c,()=>{})); }
function scheduleCloud(){ if(!_ready||!cloudOn())return; clearTimeout(_cloudTimer); _cloudTimer=setTimeout(cloudSave,800); }
function cloudLoad(cb){ if(!cloudOn()){cb(null);return;}
  TG.CloudStorage.getItem('fin_n',(e,v)=>{ const n=parseInt(v); if(e||!n){cb(null);return;}
    const keys=[];for(let i=0;i<n;i++)keys.push('fin_'+i);
    TG.CloudStorage.getItems(keys,(e2,items)=>{ if(e2||!items){cb(null);return;}
      let j='';for(let i=0;i<n;i++)j+=items['fin_'+i]||''; try{cb(JSON.parse(j))}catch(x){cb(null)} }); }); }

ensure();
applyTheme();

// ============ Kategoriya yordamchilari ============
function cats(t){return state.cats.filter(c=>!t||c.t===t)}
function catBy(n,t){return state.cats.find(c=>c.n===n&&(!t||c.t===t))||state.cats.find(c=>c.n===n)||{e:'💸',c:'#8e8e93'}}

// ============ Format ============
const SYM={UZS:'soʼm',USD:'$',EUR:'€',RUB:'₽'};
function fmt(a){const s=SYM[state.currency]||state.currency;return Math.round(Math.abs(a)).toLocaleString('ru-RU').replace(/,/g,' ')+' '+s}
function fmtSigned(a){return(a>0?'+':a<0?'−':'')+fmt(a)}
function compact(a){const s=SYM[state.currency]||state.currency,x=Math.abs(a);
  if(x>=1e6)return(a/1e6).toFixed(1).replace('.0','')+'M '+s; if(x>=1e3)return Math.round(a/1e3)+'K '+s; return fmt(a)}
function fmtNumInput(val){
  if(val==null||val==='')return '';
  const s=String(val).replace(/\s/g,'').replace(/,/g,'.');
  const parts=s.split('.');
  if(parts[0]){parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
  return parts.join('.');
}
function formatAmtInput(el){
  const start=el.selectionStart;
  const oldLen=el.value.length;
  const raw=el.value.replace(/\s/g,'').replace(/,/g,'.');
  const parts=raw.split('.');
  if(parts[0]){parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
  const formatted=parts.join('.');
  el.value=formatted;
  if(typeof form==='object'&&form!==null) form.amount=raw;
  el.style.outline='none';
  const diff=formatted.length-oldLen;
  try{el.setSelectionRange(start+diff,start+diff);}catch(e){}
}

// ============ Sana ============
const now=()=>new Date();
function monthStart(d=now()){return new Date(d.getFullYear(),d.getMonth(),1)}
function weekStart(d=now()){const x=new Date(d);const g=(x.getDay()+6)%7;x.setDate(x.getDate()-g);x.setHours(0,0,0,0);return x}
function yearStart(d=now()){return new Date(d.getFullYear(),0,1)}
function addP(d,p,n=1){const x=new Date(d);
  if(p==='daily')x.setDate(x.getDate()+n); else if(p==='weekly')x.setDate(x.getDate()+7*n);
  else if(p==='yearly')x.setFullYear(x.getFullYear()+n); else x.setMonth(x.getMonth()+n); return x}
function pStart(p){return p==='weekly'?weekStart():p==='yearly'?yearStart():monthStart()}
function sameDay(a,b){
  if(!a||!b) return false;
  const da=new Date(a),db=new Date(b);
  return !isNaN(da.getTime())&&!isNaN(db.getTime())&&da.toDateString()===db.toDateString();
}
function fmtD(d,o){
  if(!d) return '';
  const dt=new Date(d);
  return isNaN(dt.getTime()) ? '' : dt.toLocaleDateString('ru-RU',o||{day:'numeric',month:'short'});
}
function toLocalInput(d){
  const x=new Date(d||Date.now());
  if(isNaN(x.getTime())) return '';
  const p=n=>String(n).padStart(2,'0');
  return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}T${p(x.getHours())}:${p(x.getMinutes())}`;
}

function signed(t){return t.type==='income'?t.amount:t.type==='expense'?-t.amount:0}
function accountBalance(id){
  const a=accBy(id);let b=a.opening||0;
  state.tx.forEach(t=>{ if(t.accountId===id){ if(t.type==='income')b+=t.amount; else b-=t.amount; }
    if(t.type==='transfer'&&t.toAccountId===id)b+=t.amount; });
  return b;
}
function total(){return state.accounts.reduce((s,a)=>s+accountBalance(a.id),0)}

function monthly(type){const ms=monthStart().getTime();
  return state.tx.filter(t=>t.type===type&&t.cat!=='Qarz'&&new Date(t.date).getTime()>=ms).reduce((s,t)=>s+t.amount,0)}

function runRecurring(){
  let changed=false;const today=now();
  state.recurring.forEach(r=>{ if(r.active===false)return; let due=new Date(r.nextDue);
    while(due<=today){ state.tx.push({id:genId(),type:r.type,amount:r.amount,cat:r.cat,
        accountId:r.accountId||state.accounts[0].id,merchant:r.title,note:'',date:due.toISOString(),fav:false});
      due=addP(due,r.period); r.nextDue=due.toISOString(); changed=true; } });
  if(changed)save();
}

function parseNL(txt){const s=txt.toLowerCase();let amount=0;
  const km=s.match(/(\d+(?:[.,]\d+)?)\s*(mln|m|ming|k)\b/);
  if(km){let v=parseFloat(km[1].replace(',','.'));amount=/m/.test(km[2])?v*1e6:v*1e3;}
  else{amount=parseInt(s.replace(/[^\d]/g,''))||0;}
  if(!amount)return null;let type='expense',cat=null;
  for(const k in KW){if(s.includes(k)){cat=KW[k][0];type=KW[k][1];break;}}
  return{amount,type,cat};}

function weeklyChart(){
  chartData = [];
  const d = now();
  for(let i=6; i>=0; i--){
    const dd = new Date(d);
    dd.setDate(d.getDate() - i);
    const inc = state.tx.filter(t => t.type === 'income' && t.cat !== 'Qarz' && sameDay(t.date, dd)).reduce((s,t) => s + t.amount, 0);
    const exp = state.tx.filter(t => t.type === 'expense' && t.cat !== 'Qarz' && sameDay(t.date, dd)).reduce((s,t) => s + t.amount, 0);
    chartData.push({ d: dd, inc, exp });
  }
  const max = Math.max(...chartData.map(x => Math.max(x.inc, x.exp)), 1);
  const wd = ['Ya','Du','Se','Ch','Pa','Ju','Sh'];
  
  function scaleH(v){
    if(!v || v <= 0) return 0;
    return Math.max(Math.pow(v / max, 0.55) * 100, 10);
  }

  const selDay = chartData[chartSelIdx] || chartData[6] || chartData[0];
  const diff = selDay ? selDay.inc - selDay.exp : 0;
  
  return `<div class="card">
    <div id="chartInfo" style="background:var(--sep);border-radius:10px;padding:8px 12px;margin-bottom:10px">
      <div style="font-size:12px;font-weight:700;margin-bottom:2px">${selDay ? selDay.d.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'}) : ''}</div>
      <div style="font-size:12px;display:flex;gap:12px;flex-wrap:wrap">
        <span style="color:var(--income)">🟢 +${fmt(selDay ? selDay.inc : 0)}</span>
        <span style="color:var(--expense)">🔴 −${fmt(selDay ? selDay.exp : 0)}</span>
        <span style="font-weight:700;color:${diff>=0?'var(--income)':'var(--expense)'}">📊 ${fmtSigned(diff)}</span>
      </div>
    </div>
    <div class="bars" style="height:110px;gap:6px">
      ${chartData.map((x, i) => `
        <div class="daycol" onclick="pickChartDay(${i})" style="flex:1;display:flex;gap:3px;align-items:flex-end;height:100%;cursor:pointer;padding:2px;border-radius:6px;background:${i===chartSelIdx?'var(--sep)':'transparent'};transition:.15s">
          <div style="flex:1;background:var(--income);border-radius:4px 4px 0 0;height:${scaleH(x.inc)}%"></div>
          <div style="flex:1;background:var(--expense);border-radius:4px 4px 0 0;height:${scaleH(x.exp)}%"></div>
        </div>
      `).join('')}
    </div>
    <div id="chartWeekdays" class="row" style="gap:6px;margin-top:4px">
      ${chartData.map((x, i) => `<div class="bl" style="flex:1;font-weight:${i===chartSelIdx?'800':'400'};color:${i===chartSelIdx?'var(--accent)':'var(--text2)'}">${wd[x.d.getDay()]}</div>`).join('')}
    </div>
    <div id="chartTxContainer" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--sep)">
      ${selDay ? chartDayTxHtml(selDay.d) : ''}
    </div>
  </div>`;
}

function listBody(list){
  if(!list.length)return emptyBig('📭','Natija yoʼq','Filtrni oʼzgartiring yoki tranzaksiya qoʼshing');
  const groups={};list.forEach(t=>{const k=new Date(t.date).toDateString();(groups[k]=groups[k]||[]).push(t);});
  let html='';for(const k in groups){const d=new Date(k);
    html+=`<div class="card"><div class="muted" style="font-size:13px;font-weight:600;margin-bottom:6px">${d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</div>${groups[k].map(t=>txRowClick(t)).join('')}</div>`;}
  return html;
}
function txRow(t){const c=catBy(t.cat,t.type);const col=t.type==='income'?'var(--income)':t.type==='expense'?'var(--expense)':'var(--transfer)';
  const sign=t.type==='income'?'+':t.type==='expense'?'−':'';const acc=accBy(t.accountId);
  const baseTitle = t.cat || t.merchant || 'Tranzaksiya';
  const nameTitle = t.note ? `${baseTitle} (${t.note})` : baseTitle;
  return `<div class="cic" style="background:${c.c}22">${t.type==='transfer'?'🔄':c.e}</div>
    <div style="flex:1;min-width:0"><div class="name">${esc(nameTitle)} ${t.fav?'⭐':''}</div>
      <div class="meta">${acc.name} · ${sameDay(t.date,now())?'Bugun':fmtD(t.date)}</div></div>
    <div class="amt mono" style="color:${col}">${sign}${fmt(t.amount)}</div>`;}
function txRowClick(t){return `<div class="tx row" onclick="openTx('${t.id}')">${txRow(t)}</div>`;}

// ============ HISOBOT ============
let reportType = 'expense'; // 'expense', 'income', 'all'
let reportRange = 'month';  // 'day', 'week', 'month', 'year'
let reportRefDate = new Date();
let reportExcludeCash = false;
let reportExcludeLarge = false;
let reportLargeThreshold = 5000000;
let reportSelectedCats = []; // empty means ALL categories

function setReportType(t){ reportType=t; render(); haptic(); }
function setReportRange(r){ reportRange=r; render(); haptic(); }
function toggleReportCash(){ reportExcludeCash=!reportExcludeCash; render(); haptic(); }
function toggleReportLarge(){ reportExcludeLarge=!reportExcludeLarge; render(); haptic(); }
function setReportLargeThreshold(val){ reportLargeThreshold=Math.max(1000, Number(val)||5000000); render(); }
function toggleReportCat(n){
  if(n === 'ALL'){
    reportSelectedCats = [];
  } else {
    const idx = reportSelectedCats.indexOf(n);
    if(idx >= 0){
      reportSelectedCats.splice(idx, 1);
    } else {
      reportSelectedCats.push(n);
    }
  }
  render();
  haptic();
}

function shiftReportPeriod(dir){
  const d = new Date(reportRefDate);
  if(reportRange === 'day') d.setDate(d.getDate() + dir);
  else if(reportRange === 'week') d.setDate(d.getDate() + (dir * 7));
  else if(reportRange === 'month') d.setMonth(d.getMonth() + dir);
  else if(reportRange === 'year') d.setFullYear(d.getFullYear() + dir);
  reportRefDate = d;
  render(); haptic();
}

function setReportPickerValue(val){
  if(!val) return;
  if(reportRange==='year') reportRefDate = new Date(Number(val), 0, 1);
  else reportRefDate = new Date(val);
  render(); haptic();
}

function getReportInterval(){
  const d = reportRefDate;
  if(reportRange === 'day'){
    const st = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0);
    const en = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59, 999);
    return { st, en, label: d.toLocaleDateString('ru-RU', {weekday:'short', day:'numeric', month:'long', year:'numeric'}) };
  } else if(reportRange === 'week'){
    const st = weekStart(d);
    const en = new Date(st.getTime() + 7*86400000 - 1);
    return { st, en, label: `${st.toLocaleDateString('ru-RU', {day:'numeric', month:'short'})} — ${en.toLocaleDateString('ru-RU', {day:'numeric', month:'short', year:'numeric'})}` };
  } else if(reportRange === 'year'){
    const st = new Date(d.getFullYear(), 0, 1);
    const en = new Date(d.getFullYear(), 11, 31, 23, 59, 59, 999);
    return { st, en, label: `${d.getFullYear()}-yil` };
  } else {
    const st = monthStart(d);
    const en = new Date(d.getFullYear(), d.getMonth()+1, 0, 23, 59, 59, 999);
    return { st, en, label: d.toLocaleDateString('ru-RU', {month:'long', year:'numeric'}) };
  }
}

function getReportPickerVal(){
  const d = reportRefDate;
  const p = n => String(n).padStart(2, '0');
  if(reportRange === 'month') return `${d.getFullYear()}-${p(d.getMonth()+1)}`;
  if(reportRange === 'year') return String(d.getFullYear());
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

function viewReport(){
  const { st, en, label } = getReportInterval();
  const stMs = st.getTime(), enMs = en.getTime();

  let allInPeriod = state.tx.filter(t => {
    const time = new Date(t.date).getTime();
    return time >= stMs && time <= enMs;
  });

  let excludedCashCount = 0;
  let excludedLargeCount = 0;

  let filtered = allInPeriod.filter(t => {
    if(reportExcludeCash){
      const acc = accBy(t.accountId);
      const isCash = t.accountId === 'cash' || (acc && acc.name && acc.name.toLowerCase().includes('naqd'));
      if(isCash){ excludedCashCount++; return false; }
    }
    if(reportExcludeLarge){
      if(t.amount >= reportLargeThreshold){ excludedLargeCount++; return false; }
    }
    if(reportSelectedCats.length > 0){
      const catName = t.cat || 'Boshqa';
      if(!reportSelectedCats.includes(catName)) return false;
    } else {
      if(t.cat === 'Qarz') return false;
    }
    return true;
  });

  let displayTx = filtered.filter(t => {
    if(reportType === 'expense') return t.type === 'expense';
    if(reportType === 'income') return t.type === 'income';
    return t.type === 'expense' || t.type === 'income';
  });

  const incTot = filtered.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount, 0);
  const expTot = filtered.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount, 0);
  const netTot = incTot - expTot;

  let currentTypeTot = 0;
  if(reportType === 'expense') currentTypeTot = expTot;
  else if(reportType === 'income') currentTypeTot = incTot;
  else currentTypeTot = expTot + incTot;

  const byCat = {};
  displayTx.forEach(t => {
    const key = t.cat || 'Boshqa';
    byCat[key] = (byCat[key] || 0) + t.amount;
  });

  const arr = Object.entries(byCat).map(([n,v])=>({n,v,c:catBy(n, reportType==='all'?null:reportType).c})).sort((a,b)=>b.v-a.v);

  let html = `<h1>Hisobot</h1>`;
  
  // Turlar segmenti
  html += `<div class="seg">
    <button class="${reportType==='expense'?'on':''}" onclick="setReportType('expense')">🔴 Xarajat</button>
    <button class="${reportType==='income'?'on':''}" onclick="setReportType('income')">🟢 Daromad</button>
    <button class="${reportType==='all'?'on':''}" onclick="setReportType('all')">⚖️ Barchasi (Sof)</button>
  </div>`;

  // Davr segmenti
  html += `<div class="seg" style="margin-top:6px">
    <button class="${reportRange==='day'?'on':''}" onclick="setReportRange('day')">Kun</button>
    <button class="${reportRange==='week'?'on':''}" onclick="setReportRange('week')">Hafta</button>
    <button class="${reportRange==='month'?'on':''}" onclick="setReportRange('month')">Oy</button>
    <button class="${reportRange==='year'?'on':''}" onclick="setReportRange('year')">Yil</button>
  </div>`;

  // Period navigator
  html += `<div class="card" style="padding:10px 14px">
    <div class="between">
      <button class="chip" onclick="shiftReportPeriod(-1)">‹ Oldingi</button>
      <b style="font-size:14px;text-align:center">${esc(label)}</b>
      <button class="chip" onclick="shiftReportPeriod(1)">Keyingi ›</button>
    </div>
    <div style="margin-top:8px;text-align:center;font-size:12px;color:var(--text2)">
      Tanlash: <input type="${reportRange==='month'?'month':reportRange==='year'?'number':'date'}" value="${getReportPickerVal()}" onchange="setReportPickerValue(this.value)" style="width:auto;display:inline-block;padding:3px 8px;font-size:12px;margin:0">
    </div>
  </div>`;

  // AI Tahlil va Filtrlar
  let aiText = '';
  if(filtered.length === 0){
    aiText = `Tanlangan davr (${label}) va kategoriyalar uchun hechkanday mos keluvchi tranzaksiya topilmadi.`;
  } else {
    aiText = `<b>Jami daromad:</b> ${fmt(incTot)} | <b>Jami xarajat:</b> ${fmt(expTot)}<br>` +
      `<b>Sof moliyaviy natija:</b> <span style="color:${netTot>=0?'var(--income)':'var(--expense)'};font-weight:700">${fmtSigned(netTot)}</span><br>`;
    if(incTot > 0 && netTot > 0){
      const rate = Math.round((netTot / incTot) * 100);
      aiText += `💡 Daromadingizning <b>${rate}%</b> qismi jamg'arilgan. Barqaror moliyaviy holat!<br>`;
    } else if(expTot > incTot && incTot > 0){
      aiText += `⚠️ Xarajat daromaddan <b>${fmt(expTot - incTot)}</b> so'mga ko'p. Resurslarni tejash tavsiya etiladi.<br>`;
    }
    if(excludedCashCount > 0 || excludedLargeCount > 0 || reportSelectedCats.length > 0){
      aiText += `🔍 <i>Filtr: ${reportSelectedCats.length > 0 ? reportSelectedCats.length + ' ta kategoriya tanlangan, ' : ''}${excludedCashCount} ta naqd va ${excludedLargeCount} ta yirik operatsiya istisno qilindi.</i>`;
    }
  }

  html += `<div class="card">
    <div class="between" style="margin-bottom:8px">
      <h2>✨ AI Tahlil va Qoʻshimcha Filtrlar</h2>
    </div>
    <div class="chips" style="margin-bottom:10px">
      <span class="chip ${reportExcludeCash?'on':''}" onclick="toggleReportCash()">💵 Naqd pulsiz</span>
      <span class="chip ${reportExcludeLarge?'on':''}" onclick="toggleReportLarge()">⚡ Yirik bitimlarsiz</span>
    </div>
    ${reportExcludeLarge ? `<div style="margin-bottom:10px;font-size:12px;color:var(--text2)">Yirik summa chegarasi: <input type="number" value="${reportLargeThreshold}" onchange="setReportLargeThreshold(this.value)" style="width:130px;display:inline-block;padding:4px 8px;font-size:12px;margin-left:4px"> UZS</div>` : ''}
    <div style="background:var(--card2);border-radius:12px;padding:12px;font-size:13px;line-height:1.5;color:var(--text)">
      ${aiText}
    </div>
  </div>`;

  // Kategoriyalar boʻyicha multi-select kartochkasi
  const availCats = cats(reportType === 'all' ? null : reportType);
  html += `<div class="card">
    <div class="between" style="margin-bottom:8px">
      <h2>🏷️ Kategoriyalar filtri (Multi-select)</h2>
      ${reportSelectedCats.length > 0 ? `<span class="link" onclick="toggleReportCat('ALL')" style="font-size:12px">Barchasi (${reportSelectedCats.length} tanlangan)</span>` : `<span class="muted" style="font-size:12px">Barchasi tanlangan</span>`}
    </div>
    <div class="chips" style="max-height:160px;overflow-y:auto">
      <span class="chip ${reportSelectedCats.length === 0 ? 'on' : ''}" onclick="toggleReportCat('ALL')">Hammasi</span>
      ${availCats.map(c => {
        const isSel = reportSelectedCats.includes(c.n);
        return `<span class="chip ${isSel ? 'on' : ''}" onclick="toggleReportCat('${c.n.replace(/'/g, "\\'")}')">${c.e} ${esc(c.n)}</span>`;
      }).join('')}
    </div>
  </div>`;

  // Summary Card (Daromad vs Xarajat)
  html += `<div class="grid2">
    ${stat('Daromad', fmt(incTot), '⬇️', 'var(--income)')}
    ${stat('Xarajat', fmt(expTot), '⬆️', 'var(--expense)')}
  </div>`;

  // Category breakdown & Donut
  if(!arr.length){
    html += emptyBig('📊', 'Maʼlumot yoʼq', 'Ushbu filtr va davr uchun tranzaksiyalar mavjud emas');
  } else {
    html += `<div class="card">
      <div style="font-weight:700;margin-bottom:12px;font-size:15px">${reportType==='expense'?'Xarajatlar taqsimoti':reportType==='income'?'Daromadlar taqsimoti':'Tranzaksiyalar taqsimoti'}</div>
      ${donut(arr, currentTypeTot)}
      <div class="legend" style="margin-top:14px">
        ${arr.slice(0, 12).map(x => `<div class="li"><span class="dot" style="background:${x.c}"></span>${esc(x.n)}<span class="pct">${currentTypeTot>0 ? Math.round(x.v/currentTypeTot*100) : 0}% · ${compact(x.v)}</span></div>`).join('')}
      </div>
    </div>`;
  }

  return html;
}
function donut(arr,tot){const R=52,C=2*Math.PI*R;let off=0;
  const segs=arr.map(x=>{const len=tot>0?(x.v/tot*C):0;const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${x.c}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s;}).join('');
  return `<svg viewBox="0 0 140 140" width="160" height="160" style="display:block;margin:0 auto">${segs}<text x="70" y="66" text-anchor="middle" font-size="11" fill="var(--text2)">Jami</text><text x="70" y="84" text-anchor="middle" font-size="13" font-weight="800" fill="var(--text)">${compact(tot)}</text></svg>`;}

// ============ QARZLAR ============
let debtFilterTab = 'lend'; // 'lend', 'borrow', 'settled'
function viewDebts(){
  const allDebts = state.debts || [];
  const activeDebts = allDebts.filter(d => d.status !== 'settled');
  const lentTot = activeDebts.filter(d => d.type === 'lend').reduce((s, d) => s + Math.max(0, d.amount - (d.paid || 0)), 0);
  const borrowedTot = activeDebts.filter(d => d.type === 'borrow').reduce((s, d) => s + Math.max(0, d.amount - (d.paid || 0)), 0);
  const netDebt = lentTot - borrowedTot;

  let currentList = [];
  if(debtFilterTab === 'lend') {
    currentList = allDebts.filter(d => d.type === 'lend' && d.status !== 'settled');
  } else if(debtFilterTab === 'borrow') {
    currentList = allDebts.filter(d => d.type === 'borrow' && d.status !== 'settled');
  } else {
    currentList = allDebts.filter(d => d.status === 'settled');
  }

  let html = head('Qarzlar', tab || 'home') +
    `<div class="grid2">
      <div class="card" style="margin-bottom:0">
        <div class="muted" style="font-size:12px">Mendan olishgan (Menga qarz)</div>
        <div class="v mono" style="color:var(--income);font-size:18px;font-weight:800;margin-top:4px">+${fmt(lentTot)}</div>
      </div>
      <div class="card" style="margin-bottom:0">
        <div class="muted" style="font-size:12px">Men olganman (Mening qarzim)</div>
        <div class="v mono" style="color:var(--expense);font-size:18px;font-weight:800;margin-top:4px">−${fmt(borrowedTot)}</div>
      </div>
    </div>
    <div class="card" style="padding:10px 14px;margin-top:10px">
      <div class="between"><span class="muted" style="font-size:13px">Sof qarz holati:</span><b class="mono" style="color:${netDebt>=0?'var(--income)':'var(--expense)'}">${fmtSigned(netDebt)}</b></div>
    </div>
    <div class="seg" style="margin:12px 0">
      <button class="${debtFilterTab==='lend'?'on':''}" onclick="debtFilterTab='lend';render()">🟢 Mendan olganlar (${allDebts.filter(d=>d.type==='lend'&&d.status!=='settled').length})</button>
      <button class="${debtFilterTab==='borrow'?'on':''}" onclick="debtFilterTab='borrow';render()">🔴 Men olganlar (${allDebts.filter(d=>d.type==='borrow'&&d.status!=='settled').length})</button>
      <button class="${debtFilterTab==='settled'?'on':''}" onclick="debtFilterTab='settled';render()">✓ Yopilganlar (${allDebts.filter(d=>d.status==='settled').length})</button>
    </div>`;

  if(!currentList.length){
    html += emptyBig('🤝', 'Qarzlar yoʻq', debtFilterTab==='lend'?'Sizdan qarz olganlar yoʻq':(debtFilterTab==='borrow'?'Siz olgan qarzlar yoʻq':'Yopilgan qarzlar tarixi mavjud emas'));
  } else {
    html += currentList.map(d => {
      const remaining = Math.max(0, d.amount - (d.paid || 0));
      const isLend = d.type === 'lend';
      const isSettled = d.status === 'settled';
      const acc = accBy(d.accountId);
      const prog = d.amount > 0 ? Math.min(100, Math.round(((d.paid || 0) / d.amount) * 100)) : 0;
      
      return `<div class="card">
        <div class="between" style="margin-bottom:6px">
          <div style="display:flex;align-items:center;gap:8px">
            <div class="cic" style="width:36px;height:36px;font-size:16px;background:${isLend?'var(--income)':'var(--expense)'}22">${isLend?'👤':'👥'}</div>
            <div>
              <div style="font-weight:700;font-size:15px">${esc(d.person)}</div>
              <div class="meta muted" style="font-size:11px">${acc.e} ${acc.name} · ${fmtD(d.date)} ${d.dueDate ? `· Muddat: ${fmtD(d.dueDate)}` : ''}</div>
            </div>
          </div>
          <div style="text-align:right">
            <div class="mono" style="font-weight:800;font-size:16px;color:${isSettled?'var(--text2)':(isLend?'var(--income)':'var(--expense)')}">${isSettled ? '✓ Yopildi' : fmt(remaining)}</div>
            ${d.paid > 0 && !isSettled ? `<div class="meta muted" style="font-size:11px">Jami: ${fmt(d.amount)}</div>` : ''}
          </div>
        </div>
        ${d.note ? `<div style="font-size:12px;color:var(--text2);margin:4px 0">${esc(d.note)}</div>` : ''}
        ${d.paid > 0 && !isSettled ? `
          <div class="prog" style="margin:8px 0 4px"><i style="width:${prog}%;background:${isLend?'var(--income)':'var(--expense)'}"></i></div>
          <div class="between" style="font-size:11px;color:var(--text2)">
            <span>Qaytarildi: ${compact(d.paid)} (${prog}%)</span>
            <span>Qoldi: ${compact(remaining)}</span>
          </div>
        ` : ''}
        <div class="between" style="margin-top:10px;padding-top:8px;border-top:1px solid var(--sep)">
          ${!isSettled ? `
            <button class="chip on" style="background:${isLend?'var(--income)':'var(--expense)'};border:none;padding:6px 14px" onclick="openRepay('${d.id}')">
              ${isLend ? '📥 Qaytarib oldim' : '📤 Qaytarib berdim'}
            </button>
          ` : `<span style="font-size:12px;color:var(--income);font-weight:600">✓ Toʻliq qaytarilgan</span>`}
          <span class="link" onclick="openDebt('${d.id}')" style="font-size:12px">Tahrirlash ›</span>
        </div>
      </div>`;
    }).join('');
  }

  html += `<button class="btn" onclick="openDebt()">+ Yangi qarz qoʻshish</button>`;
  return html;
}
// ============ XARIDLAR REJASI (WISHLIST) ============
let wishFilterTab = 'planned'; // 'planned', 'bought'

  const planned = all.filter(w => w.status !== 'bought');
  const bought = all.filter(w => w.status === 'bought');
  const plannedTot = planned.reduce((s, w) => s + (w.price || 0), 0);
  const boughtTot = bought.reduce((s, w) => s + (w.price || 0), 0);

  const headerHtml = (page !== tab) ? head('Xaridlar rejasi', tab || 'settings') : '<h1>Xaridlar rejasi</h1>';

    `<div class="card" style="margin-bottom:10px">
      <div class="between">
        <div>
          <div class="muted" style="font-size:12px">Rejadagi jami summa</div>
          <div class="v mono" style="color:var(--accent);font-size:22px;font-weight:800;margin-top:2px">${fmt(plannedTot)}</div>
        </div>
        <div style="text-align:right">
          <div class="muted" style="font-size:12px">Bajarilgan xaridlar</div>
          <div class="v mono" style="color:var(--income);font-size:16px;font-weight:700;margin-top:2px">${fmt(boughtTot)}</div>
        </div>

      <div class="grid2" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--sep);font-size:12px">
        <div>🛍️ Rejada: <b>${planned.length} ta</b></div>
        <div>✓ Olingan: <b>${bought.length} ta</b></div>
      </div>
    </div>
    <div class="seg" style="margin:10px 0 14px">
      <button class="${wishFilterTab==='planned'?'on':''}" onclick="wishFilterTab='planned';render()">🛍️ Rejada (${planned.length})</button>
      <button class="${wishFilterTab==='bought'?'on':''}" onclick="wishFilterTab='bought';render()">✓ Olinganlar (${bought.length})</button>
    </div>`;

  if(!currentList.length){
    html += emptyBig('🛍️', wishFilterTab==='planned'?'Rejalar yoʻq':'Olinganlar yoʻq', wishFilterTab==='planned'?'Olishni rejalashtirgan buyumlaringizni qoʻshing':'Hali sotib olingan buyumlar mavjud emas');
  } else {
    html += currentList.map(w => {
      const isBought = w.status === 'bought';
      const cat = catBy(w.cat, 'expense');
      const prColor = w.priority === 'high' ? 'var(--expense)' : (w.priority === 'low' ? 'var(--text2)' : 'var(--warn)');
      const prText = w.priority === 'high' ? '⭐⭐⭐ Yuqori' : (w.priority === 'low' ? '⭐ Oddiy' : '⭐⭐ Oʻrta');

      return `<div class="card" style="padding:14px">

  const dim=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,0).getDate();
  for(let i=1;i<=dim;i++)days.push({d:new Date(calMonth.getFullYear(),calMonth.getMonth(),i),dim:false});
  const wd=['Du','Se','Ch','Pa','Ju','Sh','Ya'];
  const dayTx=t=>sameDay(t.date,calSel);
  const inc=state.tx.filter(t=>t.type==='income'&&dayTx(t)).reduce((s,t)=>s+t.amount,0);
  const exp=state.tx.filter(t=>t.type==='expense'&&dayTx(t)).reduce((s,t)=>s+t.amount,0);

        return `<div class="d ${x.dim?'dim':''} ${sameDay(x.d,calSel)?'on':''}" onclick="calPick('${x.d.toISOString()}')">${x.d.getDate()}
        <div class="dots">${hi?'<i style="background:var(--income)"></i>':''}${he?'<i style="background:var(--expense)"></i>':''}</div></div>`;}).join('')}</div></div>
    <div class="card"><h2>${fmtD(calSel,{weekday:'long',day:'numeric',month:'long'})}</h2>
      <div class="grid2" style="margin:10px 0"><div><div class="muted" style="font-size:12px">Daromad</div><b style="color:var(--income)">${compact(inc)}</b></div>
        <div><div class="muted" style="font-size:12px">Xarajat</div><b style="color:var(--expense)">${compact(exp)}</b></div></div>

function viewStats(){
  const exp=state.tx.filter(t=>t.type==='expense'&&t.cat!=='Qarz');
  const daysSet=new Set(exp.map(t=>new Date(t.date).toDateString()));
  const avgD=exp.length?exp.reduce((s,t)=>s+t.amount,0)/Math.max(daysSet.size,1):0;
  const hiE=exp.reduce((m,t)=>t.amount>m?t.amount:m,0);
  const inc=state.tx.filter(t=>t.type==='income'&&t.cat!=='Qarz');const hiI=inc.reduce((m,t)=>t.amount>m?t.amount:m,0);
  // most used
  const cnt={};exp.forEach(t=>cnt[t.cat]=(cnt[t.cat]||0)+1);const most=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  // monthly comparison 6
  const mc=[];for(let i=5;i>=0;i--){const d=new Date(now().getFullYear(),now().getMonth()-i,1);const s=d.getTime();const e=new Date(d.getFullYear(),d.getMonth()+1,1).getTime();
    mc.push({m:d,inc:state.tx.filter(t=>t.type==='income'&&new Date(t.date)>=s&&new Date(t.date)<e).reduce((a,t)=>a+t.amount,0),
             exp:state.tx.filter(t=>t.type==='expense'&&new Date(t.date)>=s&&new Date(t.date)<e).reduce((a,t)=>a+t.amount,0)});}
  const mmax=Math.max(...mc.map(x=>Math.max(x.inc,x.exp)),1);
  // heatmap 15w
  const daily={};exp.forEach(t=>{const k=new Date(t.date);k.setHours(0,0,0,0);daily[k.getTime()]=(daily[k.getTime()]||0)+t.amount;});
  const hmax=Math.max(...Object.values(daily),1);const weeks=15;let heat='';
  for(let w=weeks-1;w>=0;w--){heat+='<div class="col">';for(let dd=6;dd>=0;dd--){const day=new Date(now());day.setDate(now().getDate()-(w*7+dd));day.setHours(0,0,0,0);
    const v=daily[day.getTime()]||0;const op=v===0?.08:.2+.8*Math.min(v/hmax,1);heat+=`<div class="cell" style="background:rgba(94,92,230,${op})"></div>`;}heat+='</div>';}
  return head('Statistika','settings')+
    `<div class="grid2">${stat('Oʼrtacha kunlik',compact(avgD),'📅','var(--expense)')}${stat('Oʼrtacha oylik',compact(avgD*30),'🗓️','var(--warn)')}
      ${stat('Eng katta xarajat',compact(hiE),'⬆️','var(--expense)')}${stat('Eng katta daromad',compact(hiI),'⬇️','var(--income)')}</div>
    ${most?`<div class="card"><div class="between"><span>⭐ Eng koʼp ishlatilgan</span><b>${most[0]} (${most[1]})</b></div></div>`:''}
    <div class="card"><h2>Oylar taqqoslash</h2><div class="bars" style="height:130px">${mc.map(x=>`<div style="flex:1;display:flex;gap:2px;align-items:flex-end"><div style="flex:1;background:var(--income);border-radius:4px 4px 0 0;height:${Math.max(x.inc/mmax*100,1)}%"></div><div style="flex:1;background:var(--expense);border-radius:4px 4px 0 0;height:${Math.max(x.exp/mmax*100,1)}%"></div></div>`).join('')}</div>
      <div class="row" style="gap:6px">${mc.map(x=>`<div class="bl" style="flex:1">${x.m.toLocaleDateString('ru-RU',{month:'short'})}</div>`).join('')}</div></div>
    <div class="card"><h2>Sarf issiqlik xaritasi</h2><div class="heat" style="margin-top:10px">${heat}</div><div class="hint">Toʼq rang — koʼproq sarf</div></div>`;}

function saveTx(){
  saveFormInputs();
  const amt=parseFloat(String(form.amount).replace(/[^\d.]/g,''))||0;
  if(amt<=0){
    const aEl=document.getElementById('amt');
    if(aEl){aEl.style.outline='2px solid var(--expense)';aEl.focus();}
    return;
  }
  const isT=form.type==='transfer';
  const obj={type:form.type,amount:amt,cat:isT?null:(form.cat||'Boshqa'),accountId:form.accountId,
    toAccountId:isT?form.toAccountId:null,merchant:isT?'Oʼtkazma':(form.cat||'Boshqa'),note:form.note||'',fav:!!form.fav,
    date:form.date||new Date().toISOString()};
  if(form.edit){
    const t=state.tx.find(x=>x.id===form.edit);
    if(t) Object.assign(t,obj);
    if(state.debts){
      const d = state.debts.find(x=>x.txId===form.edit);
      if(d){
        if(obj.cat === 'Qarz'){
          d.amount = amt;
          d.type = (obj.type === 'expense') ? 'lend' : 'borrow';
          d.accountId = obj.accountId;
          d.date = obj.date;
          d.note = obj.note || '';
          d.person = extractPersonFromTx(obj);
          if((d.paid || 0) >= d.amount) d.status = 'settled';
          else d.status = 'active';
        } else {
          state.debts = state.debts.filter(x => x.txId !== form.edit);
        }
      }
    }
  } else {
    obj.id=genId();
    state.tx.push(obj);
    if(obj.cat === 'Qarz'){
      const isExp = obj.type === 'expense';
      const personName = extractPersonFromTx(obj);
      state.debts = state.debts || [];

function saveDebtInputs(){
  const pEl = document.getElementById('dperson'); if(pEl&&typeof pEl.value==='string') form.person = pEl.value;
  const aEl = document.getElementById('damt'); if(aEl&&typeof aEl.value==='string') form.amount = aEl.value.replace(/\s/g,'').replace(/,/g,'.');
  const accEl = document.getElementById('dacc'); if(accEl&&typeof accEl.value==='string') form.accountId = accEl.value;
  const dueEl = document.getElementById('ddue'); if(dueEl&&typeof dueEl.value==='string') form.dueDate = dueEl.value;
  const noteEl = document.getElementById('dnote'); if(noteEl&&typeof noteEl.value==='string') form.note = noteEl.value;
}

function formatDebtAmtInput(el){
  const start = el.selectionStart;
  const oldLen = el.value.length;
  const raw = el.value.replace(/\s/g,'').replace(/,/g,'.');
  const parts = raw.split('.');
  if(parts[0]){parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
  const formatted = parts.join('.');
  el.value = formatted;
  form.amount = raw;
  el.style.outline = 'none';
  const diff = formatted.length - oldLen;
  try{ el.setSelectionRange(start + diff, start + diff); }catch(e){}
}

function saveDebt(){
  saveDebtInputs();
  const amt = parseFloat(String(form.amount).replace(/[^\d.]/g,''))||0;
  if(amt <= 0 || !form.person || !form.person.trim()){
    const pEl = document.getElementById('dperson');
    const aEl = document.getElementById('damt');
    if(!form.person || !form.person.trim()){
      if(pEl){ pEl.style.outline = '2px solid var(--expense)'; pEl.focus(); }
    } else if(amt <= 0){
      if(aEl){ aEl.style.outline = '2px solid var(--expense)'; aEl.focus(); }
    }
    alert('Iltimos, ism va summani toʻgʻri kiriting');
    return;
  }

  const personName = form.person.trim();
  const noteText = form.note ? form.note.trim() : '';
  const txType = form.type === 'lend' ? 'expense' : 'income';

  if(form.edit){
    const d = state.debts.find(x => x.id === form.edit);
    if(d){
      d.person = personName;
      d.amount = amt;
      d.type = form.type;
      d.accountId = form.accountId;
      d.dueDate = form.dueDate || '';
      d.note = noteText;
      if((d.paid || 0) >= d.amount) d.status = 'settled';
      else d.status = 'active';

      if(d.txId){
        const t = state.tx.find(x => x.id === d.txId);
        if(t){
          t.amount = amt;
          t.type = txType;
          t.accountId = form.accountId;
          t.merchant = personName;
          t.note = form.type === 'lend' ? `Qarz berildi: ${personName}` : `Qarz olindi: ${personName}`;
          if(noteText) t.note += ` (${noteText})`;
        }
      }
    }
  } else {
    const txId = genId();
    const newDebt = {
      id: genId(),
      txId: txId,
      type: form.type,
      person: personName,
      amount: amt,
      paid: 0,
      accountId: form.accountId,
      dueDate: form.dueDate || '',
      note: noteText,
      date: new Date().toISOString(),
      status: 'active'
    };
    state.debts.push(newDebt);

    let defaultTxNote = form.type === 'lend' ? `Qarz berildi: ${personName}` : `Qarz olindi: ${personName}`;
    if(noteText) defaultTxNote += ` (${noteText})`;

    state.tx.push({
      id: txId,
      type: txType,
      amount: amt,
      cat: 'Qarz',
      accountId: form.accountId,
      merchant: personName,
      note: defaultTxNote,
      date: newDebt.date,
      fav: false
    });
  }
  save();
  closeSheet();
  notify('success');
  render();
}

function delDebt(id){
  if(!confirm('Qarz oʻchirilsinmi?')) return;
  const d = state.debts.find(x => x.id === id);
  if(d && d.txId){
    state.tx = state.tx.filter(t => t.id !== d.txId);
  }
  state.debts = state.debts.filter(d => d.id !== id);
  save();
  closeSheet();
  notify('warning');
  render();
}

function formatRepayAmtInput(el){

  const parts = raw.split('.');
  if(parts[0]){parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
  const formatted = parts.join('.');
  el.value = formatted;
  repayForm.amount = raw;

  try{ el.setSelectionRange(start + diff, start + diff); }catch(e){}

function saveRepay(){
  saveRepayInputs();
  const amt = parseFloat(String(repayForm.amount).replace(/[^\d.]/g,''))||0;
  if(amt <= 0){
    const aEl = document.getElementById('repayAmt');
    if(aEl){ aEl.style.outline = '2px solid var(--expense)'; aEl.focus(); }
    alert('Iltimos, summani toʻgʻri kiriting');
    return;
  }
  const d = state.debts.find(x => x.id === repayForm.debtId);
  if(!d) return;

  d.paid = (d.paid || 0) + amt;
  if(d.paid >= d.amount){
    d.status = 'settled';
  }

  const txType = d.type === 'lend' ? 'income' : 'expense';
  state.tx.push({
    id: genId(),
    type: txType,
    amount: amt,
    cat: 'Qarz',
    accountId: repayForm.accountId,
    merchant: d.person,
    note: d.type === 'lend' ? `Qarz qaytarildi: ${d.person}` : `Qarz toʻlandi: ${d.person}`,
    date: new Date().toISOString(),
    isRepay: true,
    fav: false
  });

  save();
  closeSheet();
  notify('success');
  render();
}

function handleWishImage(el){
  const file = el.files?.[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){
    alert('Iltimos, faqat rasm faylini tanlang');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxDim = 600;
      let w = img.width;
      let h = img.height;
      if(w > maxDim || h > maxDim){
        if(w > h){
          h = Math.round((h * maxDim) / w);
          w = maxDim;
        } else {
          w = Math.round((w * maxDim) / h);
          h = maxDim;
        }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.75);
      form.image = compressedDataUrl;
      const prev = document.getElementById('wishImgPreview');
      if(prev){
        prev.innerHTML = `
          <div style="position:relative;width:100%;height:140px;border-radius:12px;overflow:hidden;margin-bottom:8px">
            <img src="${compressedDataUrl}" style="width:100%;height:100%;object-fit:cover;display:block">
            <button type="button" onclick="removeWishImage()" style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.65);color:#fff;border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center">✕</button>
          </div>
        `;
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function removeWishImage(){
  form.image = '';
  const prev = document.getElementById('wishImgPreview');
  if(prev){
    prev.innerHTML = `
      <label for="wimg" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:2px dashed var(--sep);border-radius:14px;cursor:pointer;background:var(--card);transition:.15s">

  render();
}

function markWishPlanned(id){
  const w = (state.wishlist || []).find(x => x.id === id);
  if(!w) return;
  w.status = 'planned';
  save();
  notify('light');
  render();
}

// ============ SHEET: Byudjet ============
function openBudget(id){const ex=id?state.budgets.find(b=>b.id===id):null;
  form=ex?{...ex,catIds:[...(ex.catIds||[])],edit:id}:{name:'',limit:'',period:'monthly',catIds:[],color:'#ff9500'};openSheet(budgetSheet);}
function budgetSheet(){return `<div class="between"><h2>${form.edit?'Byudjet':'Yangi byudjet'}</h2><span onclick="closeSheet()" style="font-size:22px">✕</span></div>
  <label class="fld">Nomi</label><input value="${esc(form.name)}" oninput="form.name=this.value" placeholder="Masalan: Oziq-ovqat">
  <label class="fld">Limit</label><input inputmode="decimal" value="${form.limit||''}" oninput="form.limit=this.value">
  <label class="fld">Davr</label><div class="seg">${['weekly','monthly','yearly'].map(p=>`<button class="${form.period===p?'on':''}" onclick="form.period='${p}';openSheet(budgetSheet)">${{weekly:'Haftalik',monthly:'Oylik',yearly:'Yillik'}[p]}</button>`).join('')}</div>
  <label class="fld">Kategoriyalar (boʼsh = barchasi)</label><div class="chips">${cats('expense').map(c=>`<span class="chip ${form.catIds.includes(c.n)?'on':''}" onclick="toggleBC('${c.n.replace(/'/g,"\\'")}')">${c.e} ${c.n}</span>`).join('')}</div>
  <label class="fld">Rang</label>${colorPick('color')}
  <button class="btn" onclick="saveBudget()">Saqlash</button>
  ${form.edit?`<button class="btn danger" onclick="delBudget('${form.edit}')">Oʼchirish</button>`:''}`;}
function toggleBC(n){const i=form.catIds.indexOf(n);if(i>=0)form.catIds.splice(i,1);else form.catIds.push(n);openSheet(budgetSheet);}
function saveBudget(){const lim=parseFloat(String(form.limit).replace(/[^\d.]/g,''))||0;if(!form.name.trim()||lim<=0)return;
  if(form.edit){const b=state.budgets.find(x=>x.id===form.edit);Object.assign(b,{name:form.name,limit:lim,period:form.period,catIds:form.catIds,color:form.color});}
  else state.budgets.push({id:genId(),name:form.name,limit:lim,period:form.period,catIds:form.catIds,color:form.color});
  save();closeSheet();render();}
function delBudget(id){if(!confirm('Oʼchirilsinmi?'))return;state.budgets=state.budgets.filter(b=>b.id!==id);save();closeSheet();render();}

// ============ SHEET: Maqsad ============
function openGoal(id){const ex=id?state.goals.find(g=>g.id===id):null;
  form=ex?{...ex,edit:id}:{name:'',target:'',current:0,e:'🎯',color:'#5856d6'};openSheet(goalSheet);}
function goalSheet(){return `<div class="between"><h2>${form.edit?'Maqsad':'Yangi maqsad'}</h2><span onclick="closeSheet()" style="font-size:22px">✕</span></div>
  <label class="fld">Nomi</label><input value="${esc(form.name)}" oninput="form.name=this.value" placeholder="Masalan: Yangi mashina">
  <label class="fld">Maqsad summasi</label><input inputmode="decimal" value="${form.target||''}" oninput="form.target=this.value">
  <label class="fld">Hozirgi jamgʼarma</label><input inputmode="decimal" value="${form.current||0}" oninput="form.current=parseFloat(this.value)||0">
  <label class="fld">Belgi</label>${emojiPick('e')}
  <label class="fld">Rang</label>${colorPick('color')}
  <button class="btn" onclick="saveGoal()">Saqlash</button>
  ${form.edit?`<button class="btn danger" onclick="delGoal('${form.edit}')">Oʼchirish</button>`:''}`;}
function saveGoal(){const tg=parseFloat(String(form.target).replace(/[^\d.]/g,''))||0;if(!form.name.trim()||tg<=0)return;
  if(form.edit){const g=state.goals.find(x=>x.id===form.edit);Object.assign(g,{name:form.name,target:tg,current:form.current,e:form.e,color:form.color});}
  else state.goals.push({id:genId(),name:form.name,target:tg,current:form.current,e:form.e,color:form.color});
  save();closeSheet();render();}
function delGoal(id){if(!confirm('Oʼchirilsinmi?'))return;state.goals=state.goals.filter(g=>g.id!==id);save();closeSheet();render();}
function openContribute(id){const g=state.goals.find(x=>x.id===id);form={gid:id,add:''};
  openSheet(`<div class="between"><h2>${esc(g.name)}</h2><span onclick="closeSheet()" style="font-size:22px">✕</span></div>
   <label class="fld">Qancha qoʼshasiz?</label><input class="amtinput" inputmode="decimal" placeholder="0" oninput="formatAmtInput(this)">
   <button class="btn" onclick="doContribute()">Qoʼshish</button>`);}
function doContribute(){const g=state.goals.find(x=>x.id===form.gid);g.current+=parseFloat(String(form.add).replace(/[^\d.]/g,''))||0;save();closeSheet();notify('success');render();}

// ============ SHEET: Takrorlanuvchi ============
function openRecurring(id){
  const ex = id ? state.recurring.find(r => r.id === id) : null;
  const defCat = cats('expense')[0]?.n || 'Xarid';
  form = ex ? { ...ex, edit: id } : {
    title: '',
    type: 'expense',
    amount: '',
    period: 'monthly',
    cat: defCat,
    accountId: state.accounts[0]?.id || 'cash',
    nextDue: toLocalInput(new Date()).slice(0, 10),
    active: true
  };
  openSheet(recurringSheet);
  haptic('medium');
}

function recurringSheet(){
  const isExp = form.type === 'expense';
  const currCats = cats(form.type);
  if(!currCats.some(c => c.n === form.cat)){
    form.cat = currCats[0]?.n || (isExp ? 'Xarid' : 'Maosh');
  }
  const dueDateVal = form.nextDue ? (form.nextDue.includes('T') ? form.nextDue.slice(0, 10) : form.nextDue) : toLocalInput(new Date()).slice(0, 10);

  return `<div class="between"><h2>${form.edit ? 'Qoidani tahrirlash' : 'Yangi takrorlanuvchi toʻlov'}</h2><span onclick="closeSheet()" style="font-size:22px;cursor:pointer">✕</span></div>
  <label class="fld">Nomi</label>
  <input id="rtitle" value="${esc(form.title||'')}" oninput="form.title=this.value" placeholder="Masalan: Netflix, Ijara, Maosh">
  
  <div class="seg" style="margin-top:12px">
    <button type="button" class="${isExp?'on':''}" onclick="saveRecurringInputs();form.type='expense';reSheet()">Xarajat</button>
    <button type="button" class="${!isExp?'on':''}" onclick="saveRecurringInputs();form.type='income';reSheet()">Daromad</button>
  </div>
  
  <label class="fld">Summa</label>
  <input class="amtinput" id="ramt" inputmode="decimal" placeholder="0" value="${fmtNumInput(form.amount)}" oninput="formatRecurringAmtInput(this)">
  
  <label class="fld">Davr (Qanchada takrorlanadi?)</label>
  <select id="rperiod" onchange="form.period=this.value">
    ${['daily','weekly','monthly','yearly'].map(p => `<option value="${p}" ${form.period===p?'selected':''}>${{daily:'Kunlik',weekly:'Haftalik',monthly:'Oylik',yearly:'Yillik'}[p]}</option>`).join('')}
  </select>
  
  <label class="fld">Kategoriya</label>
  <select id="rcat" onchange="form.cat=this.value">
    ${currCats.map(c => `<option value="${c.n}" ${form.cat===c.n?'selected':''}>${c.e} ${c.n}</option>`).join('')}
  </select>
  
  <label class="fld">${isExp ? 'Qaysi hisobdan yechiladi' : 'Qaysi hisobga tushadi'}</label>
  <select id="racc" onchange="form.accountId=this.value">
    ${state.accounts.map(a => `<option value="${a.id}" ${form.accountId===a.id?'selected':''}>${a.e} ${a.name}</option>`).join('')}
  </select>

  <label class="fld">Boshlanish / Keyingi toʻlov sanasi</label>
  <input type="date" id="rdue" value="${dueDateVal}" oninput="form.nextDue=this.value">

  <button class="btn" onclick="saveRecurring()">Saqlash</button>
  ${form.edit ? `<button class="btn danger" onclick="delRecurring('${form.edit}')">Oʻchirish</button>` : ''}`;
}

function saveRecurringInputs(){
  const tEl = document.getElementById('rtitle'); if(tEl && typeof tEl.value === 'string') form.title = tEl.value;
  const aEl = document.getElementById('ramt'); if(aEl && typeof aEl.value === 'string') form.amount = aEl.value.replace(/\s/g,'').replace(/,/g,'.');
  const pEl = document.getElementById('rperiod'); if(pEl && typeof pEl.value === 'string') form.period = pEl.value;
  const cEl = document.getElementById('rcat'); if(cEl && typeof cEl.value === 'string') form.cat = cEl.value;
  const accEl = document.getElementById('racc'); if(accEl && typeof accEl.value === 'string') form.accountId = accEl.value;
  const dEl = document.getElementById('rdue'); if(dEl && typeof dEl.value === 'string') form.nextDue = dEl.value;
}

function formatRecurringAmtInput(el){
  const start = el.selectionStart;
  const oldLen = el.value.length;
  const raw = el.value.replace(/\s/g,'').replace(/,/g,'.');
  const parts = raw.split('.');
  if(parts[0]){parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
  const formatted = parts.join('.');
  el.value = formatted;
  form.amount = raw;
  el.style.outline = 'none';
  const diff = formatted.length - oldLen;
  try{ el.setSelectionRange(start + diff, start + diff); }catch(e){}
}

function saveRecurring(){
  saveRecurringInputs();
  const amt = parseFloat(String(form.amount).replace(/[^\d.]/g,'')) || 0;
  if(!form.title || !form.title.trim()){
    const tEl = document.getElementById('rtitle');
    if(tEl){ tEl.style.outline = '2px solid var(--expense)'; tEl.focus(); }
    alert('Iltimos, toʻlov nomini kiriting');
    return;
  }
  if(amt <= 0){
    const aEl = document.getElementById('ramt');
    if(aEl){ aEl.style.outline = '2px solid var(--expense)'; aEl.focus(); }
    alert('Iltimos, toʻlov summasini toʻgʻri kiriting');
    return;
  }

  let nextDueDate = form.nextDue ? new Date(form.nextDue) : new Date();
  if(isNaN(nextDueDate.getTime())) nextDueDate = new Date();

  state.recurring = state.recurring || [];
  if(form.edit){
    const r = state.recurring.find(x => x.id === form.edit);
    if(r){
      Object.assign(r, {
        title: form.title.trim(),
        type: form.type || 'expense',
        amount: amt,
        period: form.period || 'monthly',
        cat: form.cat || (form.type === 'income' ? 'Maosh' : 'Xarid'),
        accountId: form.accountId || state.accounts[0]?.id || 'cash',
        nextDue: nextDueDate.toISOString(),
        active: form.active !== false
      });
    }
  } else {
    state.recurring.push({
      id: genId(),
      title: form.title.trim(),
      type: form.type || 'expense',
      amount: amt,
      period: form.period || 'monthly',
      cat: form.cat || (form.type === 'income' ? 'Maosh' : 'Xarid'),
      accountId: form.accountId || state.accounts[0]?.id || 'cash',
      nextDue: nextDueDate.toISOString(),
      active: true
    });
  }

  save();
  closeSheet();
  notify('success');
  render();
}

function delRecurring(id){
  if(!confirm('Takrorlanuvchi toʻlov oʻchirilsinmi?')) return;
  state.recurring = (state.recurring || []).filter(r => r.id !== id);
  save();
  closeSheet();
  notify('warning');
  render();
}

// ============ SHEET: Kategoriya ============
function openCategory(idx){const ex=(idx!=null)?state.cats[idx]:null;
  form=ex?{...ex,edit:idx}:{n:'',e:'📦',c:'#8e8e93',t:catTab};openSheet(categorySheet);}
function categorySheet(){return `<div class="between"><h2>${form.edit!=null?'Kategoriya':'Yangi kategoriya'}</h2><span onclick="closeSheet()" style="font-size:22px">✕</span></div>
  <div style="text-align:center;margin:12px"><div class="cic" style="width:70px;height:70px;font-size:32px;background:${form.c}22;margin:0 auto">${form.e}</div></div>
  <label class="fld">Nomi</label><input value="${esc(form.n)}" oninput="form.n=this.value">
  <label class="fld">Belgi</label>${emojiPick('e')}
  <label class="fld">Rang</label>${colorPick('c')}
  <button class="btn" onclick="saveCategory()">Saqlash</button>
  ${form.edit!=null?`<button class="btn danger" onclick="delCategory(${form.edit})">Oʼchirish</button>`:''}`;}
function saveCategory(){if(!form.n.trim())return;
  if(form.edit!=null){Object.assign(state.cats[form.edit],{n:form.n,e:form.e,c:form.c});}
  else state.cats.push({n:form.n,e:form.e,c:form.c,t:form.t});
  save();closeSheet();render();}
function delCategory(idx){if(!confirm('Oʼchirilsinmi?'))return;state.cats.splice(idx,1);save();closeSheet();render();}

// ============ Piker yordamchilari ============
function emojiPick(key){return `<div class="chips" style="max-height:120px;overflow-y:auto">${EMOJIS.map(e=>`<span class="chip ${form[key]===e?'on':''}" style="font-size:18px" onclick="form['${key}']='${e}';reSheet()">${e}</span>`).join('')}</div>`;}
function colorPick(key){return `<div class="chips">${PALETTE.map(c=>`<span onclick="form['${key}']='${c}';reSheet()" style="width:30px;height:30px;border-radius:50%;background:${c};cursor:pointer;${form[key]===c?'outline:3px solid var(--text3)':''}"></span>`).join('')}</div>`;}

// ============ Modal boshqaruvi ============
let _sheetFn=null;
function openSheet(v){
  if(typeof v==='function'){_sheetFn=v;document.getElementById('sheet').innerHTML=v();}
  else {_sheetFn=null;document.getElementById('sheet').innerHTML=v;}
  document.getElementById('modal').classList.add('show');
  try{ if(TG&&TG.BackButton) TG.BackButton.show(); }catch(e){}
}
function reSheet(){ if(_sheetFn)document.getElementById('sheet').innerHTML=_sheetFn(); }
function closeSheet(){
  document.getElementById('modal').classList.remove('show');
  try{
    if(TG&&TG.BackButton){
      if(page===tab) TG.BackButton.hide();
      else TG.BackButton.show();
    }
  }catch(e){}
}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet();});

// ============ Amallar ============
function setCur(c){state.currency=c;save();render();}
function setTheme(t){state.theme=t;save();applyTheme();render();}
function clearAll(){if(confirm('BARCHA maʼlumot oʼchiriladi. Davom etilsinmi?')){const cur=state.currency,th=state.theme;state={currency:cur,theme:th};ensure();save();render();}}
function exportCSV(){let csv='Sana,Tur,Kategoriya,Hisob,Izoh,Summa\n';
  state.tx.forEach(t=>{csv+=[fmtD(t.date,{day:'2-digit',month:'2-digit',year:'numeric'}),t.type,t.cat||'',accBy(t.accountId).name,(t.note||'').replace(/,/g,' '),signed(t)].join(',')+'\n';});
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='hisobot.csv';a.click();}
function esc(s){return(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

// ---- Ishga tushirish: avval lokal, keyin bulut bilan sync ----
function boot(){
  render(); // lokal maʼlumot bilan darhol koʼrsatamiz
  if(!cloudOn()){ _ready=true; runRecurring(); localWrite(); return; }
  let done=false;
  cloudLoad(cloud=>{ if(done)return; done=true; _ready=true;
    if(cloud && (cloud.updatedAt||0) >= (state.updatedAt||0)){
      // Bulutdagi maʼlumot yangiroq — uni olamiz (qayta yozmaymiz)
      state=cloud; ensure(); applyTheme(); localWrite(); runRecurring();
    } else {
      // Lokal yangiroq yoki bulut boʼsh — bulutga yuboramiz
      runRecurring(); save();
    }
    render();
  });
  // Xavfsizlik: bulut 4s ichida javob bermasa, ilovani baribir ochamiz (qayta yozmasdan)
  setTimeout(()=>{ if(done)return; done=true; _ready=true; runRecurring(); render(); },4000);
}
boot();
</script>
