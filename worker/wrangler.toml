name = "finance-report"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Oylik hisobot: har oyning 1-sanasi 05:00 UTC = 10:00 Toshkent
[triggers]
crons = ["0 5 1 * *"]

# Foydalanuvchilarning oylik jamlanmalari shu KV'da saqlanadi.
# ID'ni `wrangler kv namespace create REPORTS` buyrug'i beradi - shu yerga qo'ying.
[[kv_namespaces]]
binding = "REPORTS"
id = "a5ad2f33ba844c0db629eac66fec95a8"

[vars]
MINIAPP_URL = "https://ruzmatjs.github.io/finance-ios/"

# Maxfiy: `wrangler secret put TELEGRAM_BOT_TOKEN` orqali qo'yiladi (bu faylga YOZMANG)
