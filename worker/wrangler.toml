name = "finance-report"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Oylik hisobot: har oyning 1-sanasi 05:00 UTC = 10:00 Toshkent
[triggers]
crons = ["0 5 1 * *"]

# Foydalanuvchilarning oylik jamlanmalari shu KV'da saqlanadi.
# ID'ni `wrangler kv namespace create REPORTS` buyrug'i beradi - shu yerga qo'ying.
[[kv_namespaces]]
binding = "REPORTS"
id = "a5ad2f33ba844c0db629eac66fec95a8"

[vars]
MINIAPP_URL = "https://ruzmatjs.github.io/finance-ios/"

# Maxfiy (bu faylga YOZMANG, `wrangler secret put` orqali qo'yiladi):
#   TELEGRAM_BOT_TOKEN - @BotFather bergan token
#   WEBHOOK_SECRET     - webhook'ni himoyalaydigan tasodifiy satr
#
# Ixtiyoriy: bot faqat shu chat ID'ga javob beradi. Qo'yilmasa - birinchi /start
# yozgan odam KV'da ega sifatida qayd etiladi.
# OWNER_ID = "123456789"
