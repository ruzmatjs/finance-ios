# ============================================================================
# BEPUL Apple ID uchun konfiguratsiya (App Group / CloudKit / Push / Widget'siz).
#
# macOS'da:
#   brew install xcodegen
#   cd ios
#   xcodegen generate --spec project-free.yml
#   open FinanceApp.xcodeproj
#
# So'ng Xcode: Signing & Capabilities -> o'z Apple ID'ingizni Team qiling ->
# iPhone'ni ulang -> Run. (Sertifikat 7 kunda tugaydi, qayta Run bosasiz.)
#
# Pullik hisob olganingizda to'liq versiya uchun asosiy `project.yml`dan foydalaning.
# ============================================================================

name: FinanceApp
options:
  bundleIdPrefix: com.ruzmat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # Xcode'da o'z Apple ID Team'ingizni tanlaysiz
    TARGETED_DEVICE_FAMILY: "1" # iPhone

targets:
  FinanceApp:
    type: application
    platform: iOS
    sources:
      # Faqat ilova kodi. FinanceWidget/ papkasi bu yerda YO'Q — widget qurilmaydi.
      - path: FinanceApp
    settings:
      base:
        # FREE_TIER flagi App Group / CloudKit kodini o'chiradi (AppConfig.swift).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: FREE_TIER
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG FREE_TIER
    # "FinanceApp" nomli shared scheme yaratadi (CI'da xcodebuild -scheme uchun).
    scheme:
      testTargets:
        - FinanceAppTests
    # DIQQAT: entitlements bloki YO'Q — App Group/iCloud/Push talab qilinmaydi.
    info:
      path: FinanceApp/Info.plist
      properties:
        CFBundleDisplayName: Finance
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSFaceIDUsageDescription: "Ilovani himoyalash uchun Face ID ishlatiladi."
        NSLocationWhenInUseUsageDescription: "Tranzaksiyaga joylashuv biriktirish uchun."
        NSPhotoLibraryUsageDescription: "Chek rasmini kutubxonadan biriktirish uchun."
        NSCameraUsageDescription: "Chek rasmini kamera orqali olish uchun."
        # financeapp:// deep-link (ilova ichida ishlaydi, entitlement talab qilmaydi)
        CFBundleURLTypes:
          - CFBundleURLName: com.ruzmat.finance
            CFBundleURLSchemes:
              - financeapp

  FinanceAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FinanceAppTests
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: FREE_TIER
    dependencies:
      - target: FinanceApp
